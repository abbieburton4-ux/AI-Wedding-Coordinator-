name: Claude agents

# Autopilot: the agents pick their own work from docs/backlog.md. No issues needed.
#   schedule / "Run workflow" button -> one unit of work, delivered as one PR
#   "@claude ..." comment on a PR     -> answers questions or applies review feedback
# Agents only open PRs and comments. Branch protection on main makes merging a human act.
# Kill switch: Actions -> "Claude agents" -> Disable workflow.

on:
  schedule:
    - cron: "17 13 * * 1-5"   # weekdays 13:17 UTC; change or remove as you like
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  autopilot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: claude-autopilot
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Dependencies are installed here so the agent only needs to run the verify gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}   # for the gh CLI calls the prompt allows
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/obra/superpowers-marketplace.git
            https://github.com/EveryInc/compound-engineering-plugin.git
            https://github.com/product-on-purpose/agent-plugins.git
            https://github.com/pbakaus/impeccable.git
          plugins: |
            superpowers@superpowers-marketplace
            compound-engineering@compound-engineering-plugin
            pm-skills@product-on-purpose
            critique-skills@product-on-purpose
            impeccable@impeccable
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Agent,Task,Skill,WebSearch,WebFetch,Bash(bash scripts/verify-backend.sh),Bash(npm --prefix frontend ci),Bash(npm --prefix frontend run build),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git fetch *),Bash(git checkout *),Bash(git add *),Bash(git commit *),Bash(git push origin agent/*),Bash(gh pr list *),Bash(gh pr view *),Bash(gh pr create *),Bash(gh pr comment *)"
          prompt: |
            You are the autopilot for ${{ github.repository }}, running unattended. Follow CLAUDE.md, especially "Working unattended" and "Autopilot".
            Use installed plugins per "Using installed plugins" in CLAUDE.md, and name the ones you used in the PR.
            Backend and frontend dependencies are already installed. Stay in the repo root. For the verify gate, run exactly `bash scripts/verify-backend.sh` (all backend scripts plus clean-up) and `npm --prefix frontend run build`. Don't `cd`, and don't run the backend scripts any other way. Stage files by name, never `git add -A` or `git add .`.
            Do exactly ONE of the following, in this order, then stop:
            1. Run `gh pr list --state open --json number,headRefName,comments`.
               If any open PR's branch starts with `agent/`, start no new work.
               If the owner has commented on it since your last commit, address the comments on that branch, push, and reply on the PR.
               Otherwise end with a one-line summary.
            2. Otherwise read docs/backlog.md. If its "Next up" list is missing, empty, or older than 14 days, act as the product lane:
               - re-rank the backlog against docs/product/wedding.md and decisions.md (product-call skill);
               - write the ordered "Next up" list, with each item marked `ready` or `needs-owner: <question>`;
               - open one docs-only PR from `agent/plan-<YYYY-MM-DD>`, with the owner's questions at the top of the description.
            3. Otherwise take the first `ready` item in "Next up" and act as the engineering lane:
               - check docs/product/decisions.md settles every product question it depends on; if not, mark it `needs-owner` in a docs-only PR instead;
               - implement it on `agent/B<n>` (agent-features skill if it touches an AI feature);
               - run the verify skill, then the reviewer subagent, and fix every BLOCKING finding;
               - follow finish-work, push, and open one PR. Its description gives your reading of the item, the verify results, the reviewer's findings, and anything [ASSUMPTION], [GAP] or [BLOCKED].
            If nothing is `ready` and every item needs the owner, open no PR. End with a summary listing the open questions.
            Never merge, never push to main, never open more than one PR per run.

  reply:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && github.event.comment.user.login == github.repository_owner
    # One queue per PR or issue. GitHub keeps only the newest pending run per group,
    # so post several answers in one @claude comment rather than several in a row.
    concurrency:
      group: claude-reply-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
