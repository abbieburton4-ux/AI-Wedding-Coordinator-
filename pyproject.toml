[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Replit environment dependencies for the existing VenueFlow backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.19.0",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "google-genai>=0.1.1",
    "greenlet>=3.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.6.0",
    "sqlmodel>=0.0.16,<0.0.25",
    "uvicorn>=0.28.0",
]

[tool.uv]
package = false
